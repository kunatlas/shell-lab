name: checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./setup-ssh.sh
      - run: npm run build
      - run: npm test
      - run: npm run sandbox:build
      - run: npm run test:docker
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
